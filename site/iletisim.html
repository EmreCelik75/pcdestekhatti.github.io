<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Bilgisayar Destek</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }
        nav {
            background: #ffffff;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        nav a {
            color: #007bff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #0056b3;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h2 {
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            background: #f8f9fa;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }
        .button {
            display: block;
            width: 200px;
            text-align: center;
            margin: 20px auto;
            padding: 10px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #0056b3;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header>
        Bilgisayar Destek Platformu
    </header>
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="hizmetler.html">Hizmetler</a>
        <a href="hakkimizda.html">Hakkımızda</a>
        <a href="iletisim.html">İletişim</a>
    </nav>
    <div class="container">
        <h2>İletişim Bilgileri</h2>
        <div class="contact-info">
            <p><strong>E-posta:</strong> celikemreq@outlook.com</p>
            <p><strong>Telefon:</strong> +90 XXX XXX XX XX</p>
            <p><strong>Adres:</strong> İstanbul, Türkiye</p>
        </div>
        
        <h2>Teklif Alın</h2>
        <form class="contact-form" action="https://formsubmit.co/celikemreq@outlook.com" method="POST">
            <!-- Spam koruması için gizli input -->
            <input type="hidden" name="_captcha" value="false">
            <!-- GitHub Pages için tam URL kullanımı -->
            <input type="hidden" name="_next" value="https://EmreCelik75.github.io/tesekkurler.html">
            <!-- Form verilerinin düzenli gözükmesi için -->
            <input type="hidden" name="_template" value="table">
            <!-- Yanıt alınacak e-posta adresi için -->
            <input type="hidden" name="_reply_to" value="">
            <!-- Form başarılı olduğunda kullanıcıya gösterilecek mesaj -->
            <input type="hidden" name="_autoresponse" value="Mesajınız başarıyla alınmıştır. En kısa sürede size dönüş yapacağız.">
            
            <div class="form-group">
                <label for="name">Adınız Soyadınız:</label>
                <input type="text" id="name" name="Ad Soyad" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-posta Adresiniz:</label>
                <input type="email" id="email" name="E-posta" required 
                       oninput="document.querySelector('input[name=_reply_to]').value = this.value">
            </div>
            
            <div class="form-group">
                <label for="phone">Telefon Numaranız:</label>
                <input type="tel" id="phone" name="Telefon" required>
            </div>
            
            <div class="form-group">
                <label for="service">Hizmet Türü:</label>
                <select id="service" name="Hizmet" required>
                    <option value="">Seçiniz</option>
                    <option value="Donanım Sorunları">Donanım Sorunları</option>
                    <option value="Yazılım Sorunları">Yazılım Sorunları</option>
                    <option value="Virüs Temizleme">Virüs Temizleme</option>
                    <option value="Ağ Problemleri">Ağ Problemleri</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="message">Sorununuzu Kısaca Anlatın:</label>
                <textarea id="message" name="Mesaj" rows="4" required></textarea>
            </div>
            
            <button type="submit" class="button">Teklif İste</button>
        </form>
        <div class="social-media">
            <a href="https://www.instagram.com/celikemreq" target="_blank">Instagram</a>
        </div>
        <a href="mailto:celikemreq@outlook.com" class="button">E-posta Gönder</a>
    </div>

    <style>
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .form-group textarea {
            resize: vertical;
        }
        
        button[type="submit"] {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        button[type="submit"]:hover {
            background: #0056b3;
        }
    </style>
</body>
</html>
